# Suite timings on GitHub-hosted runners: each corpus project in its own
# job, at its pinned commit (corpus/pins.json), with jsdom, warpdom and
# happy-dom alternating in Vitest's or Jest's default pool, 2 workers, as
# scripts/research/timing-rounds.sh does locally. A final job combines the
# results into one table (median seconds and speedup per project) on the
# run's summary page and as an artifact.
#
# Needs a repository secret WARPDOM_DEPLOY_KEY: the private half of a
# read-only deploy key of the private warpdom repository.
name: timing

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Corpus projects, comma separated
        default: react-hook-form,solid,floating-ui,analog,radix-primitives,vuetify,emoji-picker-element,svelte,ark-ui,material-ui,react-spectrum,CopilotKit,ariakit,handsontable
      rounds:
        description: Rounds per project (jsdom and warpdom alternate in each)
        default: '3'
      warpdom_ref:
        description: warpdom branch, tag or commit
        default: main
      configs:
        description: Configurations (see timing-rounds.sh), e.g. add warpdomframes-default with warpdom_ref exp/fast-frames
        default: jsdom-default warpdom-default happy-dom-default
      mode:
        description: 'timing (configs above) or fastmode (learned.sh: jsdom vs warpdom fast mode, Vitest projects only)'
        type: choice
        options: [timing, fastmode]
        default: timing
      perfile:
        description: Also record per-file phase timings (Vitest projects)
        type: boolean
        default: false
      profile:
        description: After timing, one CPU-profiled run per DOM; uploads where the time went (not the profiles)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - id: list
        run: echo "projects=$(echo '${{ inputs.projects }}' | jq -cR 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')" >> "$GITHUB_OUTPUT"

  time:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      REPOS_DIR: ${{ github.workspace }}/../repos
      WARPDOM_DIR: ${{ github.workspace }}/warpdom
      ENV_DIR: .corpus-env
      CONFIGS: ${{ inputs.configs }}
      PERFILE_DIR: ${{ inputs.perfile && '.corpus-env/perfile' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sonukapoor/warpdom
          ref: ${{ inputs.warpdom_ref }}
          ssh-key: ${{ secrets.WARPDOM_DEPLOY_KEY }}
          path: warpdom
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      # pnpm and yarn at the versions the projects declare (packageManager).
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        if: matrix.project == 'ark-ui'
      # jsdom and happy-dom that the harness links into projects without them.
      - name: dom-api-tracer dependencies
        run: npm ci
      - name: warpdom dependencies (parse5, jsdom as the reference)
        run: npm ci
        working-directory: warpdom
      - name: Check out ${{ matrix.project }} at its pinned commit
        run: node scripts/research/checkout-pinned.mjs --repos-dir "$REPOS_DIR" "${{ matrix.project }}"
      - name: Time ${{ matrix.project }}
        run: |
          if [ "${{ inputs.mode }}" = fastmode ]; then
            bash scripts/research/learned.sh ".corpus-env/timing-ci-${{ matrix.project }}.csv" "${{ inputs.rounds }}" "${{ matrix.project }}"
          else
            bash scripts/research/timing-rounds.sh ".corpus-env/timing-ci-${{ matrix.project }}.csv" "${{ inputs.rounds }}" "${{ matrix.project }}"
          fi
      - name: Profile ${{ matrix.project }}
        if: inputs.profile
        run: |
          source scripts/research/lib.sh
          mkdir -p .corpus-env/profile-summary
          for env in jsdom warpdom; do
            out=.corpus-env/profile-$env
            harness --only "${{ matrix.project }}" --environment $env --profile --no-build --max-workers 2 --out $out | grep -E "^\s+(ran|failed)"
            node scripts/profile-share.mjs $out/profiles > .corpus-env/profile-summary/${{ matrix.project }}-$env.profile-share.txt
            node scripts/profile-share.mjs $out/profiles --json > .corpus-env/profile-summary/${{ matrix.project }}-$env.profile-share.json
            [ $env = warpdom ] && node scripts/research/prof-top-dom.cjs $out/profiles > .corpus-env/profile-summary/${{ matrix.project }}-warpdom.top-dom.txt
            # Profiles are large; only the summaries are uploaded.
            rm -rf $out/profiles
          done
          cat .corpus-env/profile-summary/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.project }}
          path: |
            .corpus-env/timing-ci-*.csv
            .corpus-env/timing-ci-*.env-*.json
            .corpus-env/timing-*/logs/
            .corpus-env/timing-*/tmp/
            .corpus-env/jsdom-time/tmp/
            .corpus-env/perfile/
            .corpus-env/profile-summary/
          if-no-files-found: warn
          # .corpus-env starts with a dot: hidden files are skipped by default.
          include-hidden-files: true

  report:
    needs: time
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timing-*
          path: results
          merge-multiple: true
      - name: Combine
        run: |
          set -e
          mkdir -p results
          out=results/timing-ci.csv
          echo "round,project,config,seconds,differs" > "$out"
          shopt -s nullglob
          files=(results/timing-ci-*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No timing results: every project failed (see the time jobs and their logs artifacts).' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for f in "${files[@]}"; do tail -n +2 "$f" >> "$out"; done
          node scripts/research/timing-report.cjs "$out" | tee results/report.md
          { echo '## Timing (median of rounds, jsdom vs warpdom)'; echo; cat results/report.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Per-file timings
        if: inputs.perfile
        run: |
          shopt -s nullglob
          for project in $(ls results/perfile/*.jsonl | xargs -n1 basename | cut -d. -f1 | sort -u); do
            list() { ls results/perfile/$project.$1.*.jsonl | paste -sd, -; }
            [ -n "$(list jsdom-default)" ] && [ -n "$(list warpdom-default)" ] || continue
            { echo "## $project"; node scripts/research/perfile.cjs jsdom=$(list jsdom-default) warpdom=$(list warpdom-default); echo; } >> results/perfile.md
          done
          [ -f results/perfile.md ] && { echo '## Per-file timings'; echo '```'; cat results/perfile.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: timing-report
          path: |
            results/timing-ci.csv
            results/report.md
            results/perfile.md
            results/*.env-*.json
